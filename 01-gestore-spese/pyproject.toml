[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spese"
version = "0.1.0"
description = "Gestore di spese personali da riga di comando"
requires-python = ">=3.9"

[project.scripts]
spese = "spese.cli:main"

[tool.setuptools]
packages = ["spese"]
